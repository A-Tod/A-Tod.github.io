name: bf-bump6
on:
  push:
    branches: [A-Tod-patch-3]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fix label
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          OLD = 'ח.פ 203039961'
          NEW = 'ע.מ 203039961'
          files = 0
          for p in sorted(pathlib.Path('.').glob('*.html')):
              t = p.read_text(encoding='utf-8')
              if OLD in t:
                  p.write_text(t.replace(OLD, NEW), encoding='utf-8')
                  files += 1
          print('files:', files)
          left = [str(p) for p in sorted(pathlib.Path('.').glob('*.html')) if OLD in p.read_text(encoding='utf-8')]
          if left or files < 25:
              print('FAILED', left, files); sys.exit(1)
          print('OK')
          PYEOF
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "business number is a sole trader number"
          git push
