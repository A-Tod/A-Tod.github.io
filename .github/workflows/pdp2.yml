name: build-pdp-gallery-2
on:
  push:
    branches: [A-Tod-patch-4]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/pdpgal2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add product-holo.html
          git commit -m "pdp: fix slide proportions, add dots and peek"
          git push
