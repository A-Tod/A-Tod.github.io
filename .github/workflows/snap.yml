name: build-snap-stop
on:
  push:
    branches: [content/snap-stop]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/snapfix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add product-holo.html index.html
          git commit -m "one swipe one item, drop the odd holo image"
          git push
