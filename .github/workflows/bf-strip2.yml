name: bf-strip2
on:
  push:
    branches: [blackfriday-2026]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The strip spans the full width at the top of the page
        run: |
          python3 - <<'PYEOF'
          import io, re

          STRIP = ('<section class="bf bf-strip" aria-label="בלאק פריידי">'
                   '<p class="bf-strip__h">בלאק פריידי מתקרב</p>'
                   '<p class="bf-strip__p">בחרו דגם, השאירו מייל בעמוד המוצר וקבלו קישור לרכישה כשהמבצע נפתח.</p>'
                   '</section>')

          p = "collection.html"
          t = io.open(p, encoding="utf-8").read()
          new = t

          # the strip leaves the centred column
          new = new.replace('<div class="wrap">' + STRIP + '<div class="grid-products">',
                            '<div class="wrap"><div class="grid-products">', 1)

          # and sits flush at the top of the main content
          if "bf-strip" not in new:
              new = new.replace('<main id="main">', '<main id="main">\n' + STRIP, 1)

          new = new.replace('assets/css/blackfriday.css?v2', 'assets/css/blackfriday.css?v3')

          if new != t:
              io.open(p, "w", encoding="utf-8").write(new)
              print("collection.html: strip moved to full width")
          else:
              print("collection.html: NO CHANGE")

          import glob
          n = 0
          for path in sorted(glob.glob("product-*.html")):
              txt = io.open(path, encoding="utf-8").read()
              out = txt.replace('assets/css/blackfriday.css?v2', 'assets/css/blackfriday.css?v3')
              if out != txt:
                  io.open(path, "w", encoding="utf-8").write(out)
                  n += 1
          print("product pages bumped:", n)
          PYEOF
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Black Friday 2026: full-bleed strip at the top of the collection page"
            git push
          fi
