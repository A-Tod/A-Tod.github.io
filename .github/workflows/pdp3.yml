name: build-pdp-bar
on:
  push:
    branches: [content/pdp-bar]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/pdpgal3.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add product-holo.html
          git commit -m "pdp: full-width slides with a progress bar"
          git push
