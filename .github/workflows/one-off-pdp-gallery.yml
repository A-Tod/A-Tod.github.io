name: one-off-pdp-gallery
on:
  push:
    branches: [content/pdp-gallery-all]
    paths: ['.github/workflows/one-off-pdp-gallery.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile gallery to all product pages
        run: python3 tools/pdp_gallery.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'product-*.html'
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "pdp: mobile swipe gallery on all product pages"
            git push
          fi
