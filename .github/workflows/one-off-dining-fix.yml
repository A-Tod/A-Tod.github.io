name: one-off-dining-fix
on:
  push:
    branches: [content/dining-links]
    paths: ['.github/workflows/one-off-dining-fix.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the guide link into the spec column
        run: python3 tools/dining_links_fix.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'product-*.html'
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "seo: place the guide link inside the spec column"
            git push
          fi
