name: one-off-island-lamp
on:
  push:
    branches: [content/island-lamp]
    paths: ['.github/workflows/one-off-island-lamp.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Island-lamp guide page
        run: python3 tools/island_lamp.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' sitemap.xml
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "content: island-lamp guide page"
            git push
          fi
