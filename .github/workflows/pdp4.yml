name: build-pdp-aspect
on:
  push:
    branches: [content/pdp-aspect]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/pdpgal4.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add product-holo.html
          git commit -m "pdp: uniform slide aspect so every image fills the frame"
          git push
