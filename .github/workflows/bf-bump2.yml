name: bf-bump2
on:
  push:
    branches: [A-Tod-patch-3]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bump
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          OLD = "blackfriday.js?v4"
          NEW = "blackfriday.js?v5"
          files = 0
          for p in sorted(pathlib.Path(".").glob("*.html")):
              t = p.read_text(encoding="utf-8")
              if OLD in t:
                  p.write_text(t.replace(OLD, NEW), encoding="utf-8")
                  files += 1
          print("files:", files)
          left = [str(p) for p in sorted(pathlib.Path(".").glob("*.html")) if OLD in p.read_text(encoding="utf-8")]
          if left or files < 13:
              print("FAILED", left)
              sys.exit(1)
          print("OK")
          PYEOF
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "cache-bust blackfriday.js v3 to v4"
          git push
