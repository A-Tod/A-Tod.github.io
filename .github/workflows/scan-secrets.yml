# רשת ביטחון: בודקת שלא דלף מפתח או סוד לקוד שהדפדפן מוריד.
#
# למה: כל קובץ שהאתר מגיש נפתח אצל כל מבקר בלחיצת F12. מפתח אמיתי שנכנס
# לשם הוא מפתח ציבורי. באתר הזה הסליקה רצה דרך Make, ולכן פרטי גרו לא
# אמורים להופיע באתר בכלל — והתהליך הזה נכשל בקול אם הם יופיעו.
#
# מתי זה רץ:
#   • בכל דחיפה ל-main          (לפני שהשינוי מספיק להגיע לאנשים)
#   • כל יום שני ב-04:00 UTC    (תפיסת שינויים שנעשו ישירות בממשק)
#   • ידנית מלשונית Actions
#
# אם זה נכשל: תקבל מייל מ-GitHub ויופיע X אדום ליד הקומיט.
# הפירוט נמצא בסיכום ההרצה, עם הערכים ממוסכים.

name: scan-secrets

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: סריקת מפתחות בצד הלקוח
        run: python3 tools/scan_secrets.py | tee -a "$GITHUB_STEP_SUMMARY"
