name: one-off-dining-links
on:
  push:
    branches: [content/dining-links]
    paths: ['.github/workflows/one-off-dining-links.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add internal links to the dining-lamp guide
        run: python3 tools/dining_links.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "seo: link the dining-lamp guide from pendant pages"
            git push
          fi
