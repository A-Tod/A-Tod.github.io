name: bf-tidy
on:
  push:
    branches: [blackfriday-2026]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leave untouched files byte-identical to main
        run: |
          python3 - <<'PYEOF'
          import re, glob, io

          # style.css never changed, so its cache-buster goes back to v54
          n = 0
          for path in sorted(glob.glob("*.html")):
              txt = io.open(path, encoding="utf-8").read()
              out = txt.replace('assets/css/style.css?v55', 'assets/css/style.css?v54')
              if path == "collection.html":
                  out = out.replace('<div class="wrap">\n\n<div class="grid-products">',
                                    '<div class="wrap"><div class="grid-products">')
              if out != txt:
                  io.open(path, "w", encoding="utf-8").write(out)
                  n += 1
          print("files restored:", n)
          PYEOF
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Black Friday 2026: keep the diff to the campaign files only"
            git push
          fi
