name: bf-shrink
on:
  push:
    branches: [blackfriday-2026]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The collection page needs the script, every page needs fresh versions
        run: |
          python3 - <<'PYEOF'
          import io, re, glob
          JS = '<script src="assets/js/blackfriday.js?v2"></script>'
          MAIN = re.compile(r'(<script src="assets/js/main\.js\?v\d+"></script>)')
          n = 0
          for path in sorted(glob.glob("*.html")):
              txt = io.open(path, encoding="utf-8").read()
              out = txt.replace('assets/css/blackfriday.css?v5', 'assets/css/blackfriday.css?v6')
              out = out.replace('assets/js/blackfriday.js?v1', 'assets/js/blackfriday.js?v2')
              if path == "collection.html" and "blackfriday.js" not in out:
                  out = MAIN.sub(lambda m: m.group(1) + "\n  " + JS, out, count=1)
              if out != txt:
                  io.open(path, "w", encoding="utf-8").write(out)
                  n += 1
          print("pages changed:", n)
          c = io.open("collection.html", encoding="utf-8").read()
          print("collection has script:", "blackfriday.js" in c)
          PYEOF
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Black Friday 2026: wire the shrinking banner into the collection page"
            git push
          fi
