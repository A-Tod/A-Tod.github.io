name: bf-bump
on:
  push:
    branches: [A-Tod-patch-2]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bump
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          OLD = "main.js?v58"
          NEW = "main.js?v59"
          total = 0
          files = 0
          for p in sorted(pathlib.Path(".").glob("*.html")):
              t = p.read_text(encoding="utf-8")
              n = t.count(OLD)
              if n:
                  p.write_text(t.replace(OLD, NEW), encoding="utf-8")
                  total += n
                  files += 1
          print("files:", files, "replacements:", total)
          left = [str(p) for p in sorted(pathlib.Path(".").glob("*.html")) if OLD in p.read_text(encoding="utf-8")]
          if left or files < 20:
              print("FAILED - leftovers:", left)
              sys.exit(1)
          print("OK")
          PYEOF
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "cache-bust main.js v58 to v59"
          git push
