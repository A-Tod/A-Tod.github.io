# תהליך חד-פעמי: יישור תמונות הכרטיסים בעמודי הרשימה לתמונה הראשית
# שהוחלפה בדפי המוצר של Odd, Opo ו-Loe. נמחק אחרי ההרצה.
name: one-off-cards

on: workflow_dispatch

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: עדכון תמונות הכרטיסים
        run: |
          set -e
          LIST="collection.html category-pendant-lamps.html category-wall-lamps.html category-ceiling-lamps.html"

          # Odd  — תמונה ראשית: הצילום החדש
          sed -i 's/6105df10[0-9a-f]*/8f2b36f360ce4fa0abd96aa516981f3e/g' $LIST
          # Opo  — ראשית: הצילום החדש · ריחוף: חדר השינה מהגלריה
          sed -i 's/79a25f3b[0-9a-f]*/c7b6998ecbf8463daffc42bd8d1b8846/g' $LIST
          sed -i 's/476cae15[0-9a-f]*/284e1ad24b2e44a6abdf4eb87ff0cda4/g' $LIST
          # Loe  — ראשית: הצילום החדש · ריחוף: תקרת המטבח מהגלריה
          sed -i 's/04cdab05[0-9a-f]*/d43a9c714e864442bcf9e8151f4ccb47/g' $LIST
          sed -i 's/0c759480[0-9a-f]*/9cee55c9d3024d39836f6394c0697620/g' $LIST

          echo "נותרו הפניות ישנות בעמודי הרשימה:" | tee -a "$GITHUB_STEP_SUMMARY"
          LEFT=$(grep -o -E '6105df10|79a25f3b|476cae15|04cdab05|0c759480' $LIST | wc -l)
          echo "  $LEFT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "הפניות חדשות:" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -o -E '8f2b36f3|c7b6998e|284e1ad2|d43a9c71|9cee55c9' $LIST | sort | uniq -c | tee -a "$GITHUB_STEP_SUMMARY"
          test "$LEFT" -eq 0

      - name: קומיט
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "אין שינוי."; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "עמודי הרשימה: תמונות הכרטיסים תואמות לתמונה הראשית בדף המוצר"
          git push
