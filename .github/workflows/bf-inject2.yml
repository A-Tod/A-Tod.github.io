name: bf-inject2
on:
  push:
    branches: [blackfriday-2026]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the campaign markup
        run: |
          python3 - <<'PYEOF'
          import re, glob, io

          CATS = {
            "holo":"table", "ilo":"table", "redel":"table", "qibo":"table",
            "set":"pendant", "odd":"pendant", "ved":"pendant", "opeq":"pendant",
            "opo":"wall", "opi":"wall",
            "ule":"ceiling", "loe":"ceiling",
          }

          MARK = "/* ===== Black Friday 2026"
          CSSRE = re.compile(r'<link rel="stylesheet" href="assets/css/style\.css\?v\d+">')
          BFCSS = '<link rel="stylesheet" href="assets/css/blackfriday.css?v1">'

          # 1. the old appended block leaves style.css
          p = "assets/css/style.css"
          t = io.open(p, encoding="utf-8").read()
          i = t.find(MARK)
          if i > 0:
              io.open(p, "w", encoding="utf-8").write(t[:i].rstrip() + "\n")
              print("style.css: old campaign block removed")

          BANNER = """
          <section class="bf" aria-labelledby="bf-title">
            <div class="bf-banner">
              <p class="bf-kicker">BLACK FRIDAY</p>
              <h2 class="bf-h" id="bf-title">איזה גוף תאורה ייכנס אליכם הביתה?</h2>
              <p class="bf-perks">
                <span>25% הנחה על גוף התאורה הראשון</span>
                <span>30% הנחה על כל גוף נוסף · משלוח חינם</span>
              </p>
              <p class="bf-p">בחרו את הגוף שלכם.<br>את פתיחת המבצע כבר לא תצטרכו לזכור.</p>
              <button type="button" class="bf-btn" data-bf-scroll="#models">לבחירת גוף התאורה שלי</button>
              <div class="bf-sub">
                <p class="bf-lead">השאירו מייל וקבלו קישור לרכישה ברגע שהמבצע נפתח.</p>
                <form data-bf-form="collection banner" novalidate>
                  <div class="bf-row">
                    <label class="bf-sr" for="bf-mail">כתובת המייל</label>
                    <input class="bf-input" id="bf-mail" type="email" inputmode="email" autocomplete="email" placeholder="כתובת המייל">
                    <button type="submit" class="bf-btn">תזכירו לי כשהמבצע נפתח</button>
                  </div>
                  <div class="bf-consent">
                    <input type="checkbox" id="bf-ok">
                    <label for="bf-ok">אני מאשר/ת קבלת תזכורת במייל על המבצע · <a href="privacy.html">מדיניות הפרטיות</a></label>
                  </div>
                </form>
                <p class="bf-msg" data-bf-msg role="status" hidden></p>
                <p class="bf-note">ההרשמה היא לתזכורת על המבצע בלבד ולא לרשימת דיוור. הגופים מיוצרים לפי הזמנה; ההרשמה אינה הזמנה.</p>
              </div>
            </div>
            <div class="bf-filters" data-bf-filters role="group" aria-label="סינון לפי סוג גוף תאורה">
              <button type="button" class="bf-chip" data-bf-filter="all" aria-pressed="true">הכול</button>
              <button type="button" class="bf-chip" data-bf-filter="table" aria-pressed="false">שולחן</button>
              <button type="button" class="bf-chip" data-bf-filter="pendant" aria-pressed="false">תלייה</button>
              <button type="button" class="bf-chip" data-bf-filter="wall" aria-pressed="false">קיר</button>
              <button type="button" class="bf-chip" data-bf-filter="ceiling" aria-pressed="false">תקרה</button>
            </div>
            <p class="bf-count" data-bf-count role="status"></p>
          </section>
          """

          def pdp_block(slug, name):
              return """
          <div class="bf bf-pdp">
            <h2 class="bf-h2">זה הגוף שבחרתם?</h2>
            <p class="bf-lead">קבלו תזכורת עם קישור ישיר לדגם כשהמבצע נפתח.</p>
            <form data-bf-form="product page" data-model-id="SLUG" data-model-name="NAME" data-model-url="https://studioatod.com/product-SLUG.html" novalidate>
              <div class="bf-row">
                <label class="bf-sr" for="bf-pmail">כתובת המייל</label>
                <input class="bf-input" id="bf-pmail" type="email" inputmode="email" autocomplete="email" placeholder="כתובת המייל">
                <button type="submit" class="bf-btn">תזכירו לי על הדגם הזה</button>
              </div>
              <div class="bf-consent">
                <input type="checkbox" id="bf-pok">
                <label for="bf-pok">אני מאשר/ת קבלת תזכורת במייל על המבצע · <a href="privacy.html">מדיניות הפרטיות</a></label>
              </div>
            </form>
            <p class="bf-msg" data-bf-msg role="status" hidden></p>
          </div>
          """.replace("SLUG", slug).replace("NAME", name)

          changed = 0
          for path in sorted(glob.glob("*.html")):
              txt = io.open(path, encoding="utf-8").read()
              new = txt

              # 2. the campaign stylesheet joins every page
              if "assets/css/blackfriday.css" not in new:
                  new = CSSRE.sub(lambda m: m.group(0) + "\n  " + BFCSS, new, count=1)

              # 3. collection page: banner, filters, card types
              if path == "collection.html" and "bf-banner" not in new:
                  new = new.replace(
                      '<div class="grid-products">',
                      BANNER + '\n<div class="grid-products" id="models">', 1)
                  def tag(m):
                      slug = m.group(1)
                      kind = CATS.get(slug)
                      if not kind: return m.group(0)
                      return '<a class="card" data-bf-type="' + kind + '" href="product-' + slug + '.html">'
                  new = re.sub(r'<a class="card" href="product-([a-z0-9-]+)\.html">', tag, new)

              # 4. product pages: the reminder block, next to the buy area
              if path.startswith("product-") and "bf-pdp" not in new:
                  cta = re.search(r'data-add="([a-z0-9-]+)"\s+data-name="([^"]+)"', new)
                  if cta and '<div class="pdp__meta">' in new:
                      new = new.replace('<div class="pdp__meta">',
                                        pdp_block(cta.group(1), cta.group(2)) +
                                        '\n<div class="pdp__meta">', 1)

              if new != txt:
                  io.open(path, "w", encoding="utf-8").write(new)
                  changed += 1
          print("html files changed:", changed)
          PYEOF
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Black Friday 2026: inline banner, filters and per-model reminder"
            git push
          fi
