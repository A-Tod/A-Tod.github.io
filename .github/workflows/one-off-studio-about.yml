name: one-off-studio-about
on:
  push:
    branches: [content/studio-about]
    paths: ['.github/workflows/one-off-studio-about.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: pip install pillow
      - name: Studio and about pages
        run: python3 tools/studio_about.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- about.html studio.html assets/img tools/about
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "studio: four-stage process; about: founder portrait"
            git push
          fi
# rerun after script fix
