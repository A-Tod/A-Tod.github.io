name: one-off-nav-rename
on:
  push:
    branches: [content/nav-rename]
    paths: ['.github/workflows/one-off-nav-rename.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename the shop menu item
        run: python3 tools/nav_rename.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "nav: rename the shop menu item to lighting fixtures"
            git push
          fi
