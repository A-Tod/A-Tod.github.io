name: one-off-pdp-opening
on:
  push:
    branches: [content/pdp-opening]
    paths: ['.github/workflows/one-off-pdp-opening.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: pip install pillow
      - name: Opening photo on each product page
        run: python3 tools/pdp_opening.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- 'product-*.html' assets/img tools/opeq tools/opi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "pdp: open each model with an in-space photo"
            git push
          fi
