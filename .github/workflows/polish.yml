name: build-ui-polish
on:
  push:
    branches: [content/ui-polish]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/polish.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: touch-action, tap targets, text-wrap, tabular numerals"
          git push
