name: build-dining-page
on:
  push:
    branches: [content/dining-lamp]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/dining.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dining-lamp.html sitemap.xml collection.html
          git commit -m "content: dining-lamp guide page, sitemap entry, link from collection"
          git push
