name: bf-v3
on:
  push:
    branches: [blackfriday-2026]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fresh script version
        run: |
          python3 - <<'PYEOF'
          import io, glob
          n = 0
          for path in sorted(glob.glob("*.html")):
              txt = io.open(path, encoding="utf-8").read()
              out = txt.replace('assets/js/blackfriday.js?v2', 'assets/js/blackfriday.js?v3')
              if out != txt:
                  io.open(path, "w", encoding="utf-8").write(out)
                  n += 1
          print("pages bumped:", n)
          PYEOF
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Black Friday 2026: bump the campaign script version"
            git push
          fi
