# תהליך חד-פעמי: תיקון שם המשתמש באינסטגרם בכל קובצי האתר.
# הכתובת הקודמת הצביעה על חשבון שאינו של העסק. נמחק אחרי ההרצה.
name: one-off-instagram-fix

on: workflow_dispatch

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: תיקון הכתובת בכל הקבצים
        run: |
          OLD='instagram.com/_a_tod'
          NEW='instagram.com/a_tod_'
          FILES=$(grep -rl "$OLD" --include='*.html' --include='*.js' --include='*.css' --include='*.json' --include='*.txt' --include='*.xml' . || true)
          if [ -z "$FILES" ]; then
            echo "לא נמצאה אף הופעה של הכתובת השגויה." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$FILES" | sed 's/^/קובץ: /' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$FILES" | xargs sed -i "s#instagram\.com/_a_tod#instagram.com/a_tod_#g"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "נותרו שגויות: $(grep -rl "$OLD" --include='*.html' . | wc -l) קבצים" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "תקינות עכשיו: $(grep -rl "$NEW" --include='*.html' . | wc -l) קבצים" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: קומיט
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "אין שינוי לדחוף."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "אינסטגרם: תיקון הכתובת לחשבון הנכון a_tod_"
          git push
