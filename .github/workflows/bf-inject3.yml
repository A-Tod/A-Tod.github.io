name: bf-inject3
on:
  push:
    branches: [blackfriday-2026]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The campaign lives on product pages only
        run: |
          python3 - <<'PYEOF'
          import re, glob, io

          NOTE = '<p class="bf-note">ההרשמה היא לתזכורת על המבצע בלבד ולא לרשימת דיוור. הגופים מיוצרים לפי הזמנה; ההרשמה אינה הזמנה.</p>'
          MSG  = '<p class="bf-msg" data-bf-msg role="status" hidden></p>'
          CSSL = '<link rel="stylesheet" href="assets/css/blackfriday.css?v1">'
          JSL  = '<script src="assets/js/blackfriday.js?v1"></script>'

          # 1. collection.html goes back to exactly how it looks on the site
          p = "collection.html"
          t = io.open(p, encoding="utf-8").read()
          new = re.sub(r'\s*<section class="bf".*?</section>', "", t, flags=re.S)
          new = new.replace('<div class="grid-products" id="models">', '<div class="grid-products">')
          new = re.sub(r'<a class="card" data-bf-type="[a-z]+" href=', '<a class="card" href=', new)
          if new != t:
              io.open(p, "w", encoding="utf-8").write(new)
              print("collection.html: banner, filters and card types removed")
          else:
              print("collection.html: NO MATCH")

          # 2. the campaign assets load on product pages only
          stripped = 0
          for path in sorted(glob.glob("*.html")):
              if path.startswith("product-"):
                  continue
              txt = io.open(path, encoding="utf-8").read()
              out = txt.replace("\n  " + CSSL, "").replace(CSSL, "")
              out = out.replace("\n  " + JSL, "").replace(JSL, "")
              if out != txt:
                  io.open(path, "w", encoding="utf-8").write(out)
                  stripped += 1
          print("pages cleaned of campaign assets:", stripped)

          # 3. product pages: the disclaimer sits with the form
          n = 0
          for path in sorted(glob.glob("product-*.html")):
              txt = io.open(path, encoding="utf-8").read()
              if "bf-pdp" not in txt or "bf-note" in txt:
                  continue
              out = txt.replace(MSG, MSG + "\n  " + NOTE, 1)
              if out != txt:
                  io.open(path, "w", encoding="utf-8").write(out)
                  n += 1
          print("product pages with disclaimer:", n)
          PYEOF
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Black Friday 2026: reminder signup on product pages only"
            git push
          fi
