name: bf-hero
on:
  push:
    branches: [blackfriday-2026]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The old strip gives way to the new banner
        run: |
          python3 - <<'PYEOF'
          import io, re, glob

          HERO = ('<section class="bf-hero" aria-label="בלאק פריידי">'
                  '<div class="bf-hero__inner">'
                  '<h2 class="bf-hero__title"><span>BLACK FRIDAY</span></h2>'
                  '<p class="bf-hero__text">בחרו דגם, השאירו מייל בעמוד המוצר וקבלו קישור לרכישה כשהמבצע נפתח.</p>'
                  '</div></section>')

          p = "collection.html"
          t = io.open(p, encoding="utf-8").read()
          new = re.sub(r'<section class="bf bf-strip".*?</section>', HERO, t, count=1, flags=re.S)
          if new == t:
              print("collection.html: OLD STRIP NOT FOUND")
          new = new.replace('assets/css/blackfriday.css?v3', 'assets/css/blackfriday.css?v4')
          if new != t:
              io.open(p, "w", encoding="utf-8").write(new)
              print("collection.html: banner swapped, strip gone:", "bf-strip" not in new)

          n = 0
          for path in sorted(glob.glob("product-*.html")):
              txt = io.open(path, encoding="utf-8").read()
              out = txt.replace('assets/css/blackfriday.css?v3', 'assets/css/blackfriday.css?v4')
              if out != txt:
                  io.open(path, "w", encoding="utf-8").write(out)
                  n += 1
          print("product pages bumped:", n)
          PYEOF
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Black Friday 2026: new banner replaces the strip"
            git push
          fi
