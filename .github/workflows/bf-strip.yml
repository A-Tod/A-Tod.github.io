name: bf-strip
on:
  push:
    branches: [blackfriday-2026]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collection strip and new reminder wording
        run: |
          python3 - <<'PYEOF'
          import re, glob, io

          CSSRE = re.compile(r'<link rel="stylesheet" href="assets/css/style\.css\?v\d+">')
          BFCSS = '<link rel="stylesheet" href="assets/css/blackfriday.css?v2">'

          STRIP = ('<section class="bf bf-strip" aria-label="בלאק פריידי">'
                   '<p class="bf-strip__h">בלאק פריידי מתקרב</p>'
                   '<p class="bf-strip__p">בחרו דגם, השאירו מייל בעמוד המוצר וקבלו קישור לרכישה כשהמבצע נפתח.</p>'
                   '</section>')

          # 1. collection page: one compact strip above the grid, no email field
          p = "collection.html"
          t = io.open(p, encoding="utf-8").read()
          new = t
          if "assets/css/blackfriday.css" not in new:
              new = CSSRE.sub(lambda m: m.group(0) + "\n  " + BFCSS, new, count=1)
          if "bf-strip" not in new:
              new = new.replace('<div class="wrap"><div class="grid-products">',
                                '<div class="wrap">' + STRIP + '<div class="grid-products">', 1)
          if new != t:
              io.open(p, "w", encoding="utf-8").write(new)
              print("collection.html: strip added")
          else:
              print("collection.html: NO CHANGE")

          # 2. product pages: new wording, same mechanism
          PAIRS = [
            ('<h2 class="bf-h2">זה הגוף שבחרתם?</h2>',
             '<h2 class="bf-h2">קבלו תזכורת לבלאק פריידי</h2>'),
            ('קבלו תזכורת עם קישור ישיר לדגם כשהמבצע נפתח.',
             'השאירו מייל וקבלו קישור ישיר לדגם הזה כשהמבצע נפתח.'),
            ('>תזכירו לי על הדגם הזה<', '>שלחו לי תזכורת<'),
            ('assets/css/blackfriday.css?v1', 'assets/css/blackfriday.css?v2'),
          ]
          n = 0
          for path in sorted(glob.glob("product-*.html")):
              txt = io.open(path, encoding="utf-8").read()
              out = txt
              for a, b in PAIRS:
                  out = out.replace(a, b)
              if out != txt:
                  io.open(path, "w", encoding="utf-8").write(out)
                  n += 1
          print("product pages updated:", n)
          PYEOF
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Black Friday 2026: collection strip and clearer reminder wording"
            git push
          fi
